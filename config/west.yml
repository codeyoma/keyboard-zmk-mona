manifest:
  remotes:
    - name: codeyoma
      url-base: https://github.com/codeyoma
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    # Pinned to the latest ZMK release. Change v0.3 to v0.4 here and in
    # .github/workflows/build.yml together once ZMK v0.4 is released; the board then
    # becomes xiao_ble//zmk, and the modules below need versions for ZMK v0.4.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml

    # PAW3222 trackball sensor driver, pinned to a commit that builds with ZMK v0.3
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: df65288

    # Battery and connection status on the XIAO's RGB LED
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3-branch

    # KeyLay: the active layer and batteries for the KeyLay app, and the &keylay key
    - name: keylay
      remote: codeyoma
      revision: main

  self:
    path: config
