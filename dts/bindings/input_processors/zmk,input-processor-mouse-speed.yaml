description: |
  Turns sensor counts into the CPI of the current speed level (src/mouse_speed.c). The
  parameter is 0 for the current normal level (cpi-levels), 1 for the current sniping level
  (snipe-cpi-levels).

compatible: "zmk,input-processor-mouse-speed"

include: ip_one_param.yaml

properties:
  type:
    type: int
    required: true
  codes:
    type: array
    required: true
  sensor-cpi:
    type: int
    required: true
    description: The CPI the sensor reports at (its res-cpi)
  cpi-levels:
    type: array
    required: true
    description: The CPI of each speed level, slowest first
  snipe-cpi-levels:
    type: array
    required: true
    description: The CPI of each sniping level, slowest first
